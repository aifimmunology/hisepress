version: 2
project_name: hisepress

builds:
  - main: ./cmd/hisepress
    binary: hisepress
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE*, schema/suite.schema.json]

checksum:
  name_template: checksums.txt
